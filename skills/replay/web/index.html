<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Replay Theater · Codex</title>
<link rel="stylesheet" href="style.css">
<script src="icons.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="app-shell">
  <header class="app-header">
    <div class="brand">
      <svg class="brand-art" aria-hidden="true" viewBox="0 0 24 24" fill="none">
        <rect x="2.75" y="4.75" width="18.5" height="14.5" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 5v14m10-14v14M3 9h4m-4 6h4m10-6h4m-4 6h4" stroke="currentColor" stroke-width="1.5"/>
        <path d="m10.25 8.75 5 3.25-5 3.25z" fill="currentColor"/>
      </svg>
      <h1>Replay Theater</h1>
    </div>
    <div class="session-controls">
      <select id="turns" aria-label="Turn" disabled><option>Loading…</option></select>
      <div id="scope" class="scope-picker" role="group" aria-label="Edit status">
        <button type="button" data-scope="applied" aria-pressed="true" disabled>Applied</button>
        <button type="button" data-scope="review" aria-pressed="false" disabled>Review<span id="review-count" hidden></span></button>
        <button type="button" data-scope="all" aria-pressed="false" disabled>All</button>
      </div>
    </div>
    <div class="header-actions">
      <span id="save-state" class="sr-only" role="status"></span>
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh"><span data-icon="refresh-cw"></span></button>
      <button id="about" class="icon-button" type="button" aria-label="Details and shortcuts" title="Details · ?"><span data-icon="info"></span></button>
    </div>
  </header>
  <div id="error" class="error-banner" role="alert" hidden>
    <span id="error-text"></span><button id="retry" class="text-button" type="button">Retry</button>
  </div>
  <div id="replay" aria-busy="true">
    <div id="workspace" class="workspace">
      <aside id="step-panel" class="step-panel">
        <label class="search-field">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Filter files" aria-label="Filter files" autocomplete="off">
          <button id="clear-search" class="clear-search" type="button" aria-label="Clear filter" hidden><span data-icon="x"></span></button>
        </label>
        <nav id="steps" aria-label="Edits"></nav>
      </aside>
      <section class="viewer" aria-label="Diff">
        <header class="file-bar">
          <div id="file-context" class="file-title">
            <button id="list-toggle" class="icon-button" type="button" aria-controls="step-panel" aria-expanded="true" aria-label="Toggle edit list" title="Edit list"><span data-icon="panel-left"></span></button>
            <h2 id="heading"></h2>
            <span id="kind-badge" class="kind-badge" hidden></span>
          </div>
          <div class="file-tools">
            <span id="meta" class="diff-meta"></span>
            <div class="view-toggle" role="group" aria-label="Diff layout">
              <button id="split" type="button" aria-label="Side by side" aria-pressed="true" title="Side by side"><span data-icon="columns-2"></span></button>
              <button id="unified" type="button" aria-label="Unified" aria-pressed="false" title="Unified"><span data-icon="list"></span></button>
            </div>
            <label class="wrap-control icon-button" title="Wrap lines"><input id="wrap" type="checkbox" aria-label="Wrap lines"><span data-icon="wrap-text"></span></label>
            <button id="copy" class="icon-button" type="button" aria-label="Copy diff" title="Copy diff" disabled><span data-icon="copy"></span></button>
            <button id="annotate" class="text-button" type="button" hidden>Annotate</button>
          </div>
        </header>
        <p id="step-note" class="step-note" role="note" hidden></p>
        <div id="diff" oai-annotation-container-text tabindex="0" aria-label="Code diff"><div class="empty-state"><h3>Loading…</h3></div></div>
      </section>
    </div>
    <section class="player" aria-label="Playback">
      <nav id="filmstrip" class="filmstrip" aria-label="Timeline"></nav>
      <div class="player-controls">
        <span id="count" class="step-counter" role="status" aria-live="polite">—</span>
        <div class="transport">
          <button id="restart" class="icon-button" type="button" aria-label="First edit" title="First edit · Home" disabled><span data-icon="rotate-ccw"></span></button>
          <button id="prev" class="icon-button" type="button" aria-label="Previous edit" title="Previous · ←" disabled><span data-icon="chevron-left"></span></button>
          <button id="play" class="play-button" type="button" aria-label="Play" title="Play / Pause · Space" disabled><span id="play-icon" data-icon="play"></span></button>
          <button id="next" class="icon-button" type="button" aria-label="Next edit" title="Next · →" disabled><span data-icon="chevron-right"></span></button>
        </div>
        <select id="speed" aria-label="Playback speed"><option value="3600">0.5×</option><option value="1800" selected>1×</option><option value="900">2×</option></select>
      </div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</main>
<dialog id="about-dialog" aria-labelledby="about-title">
  <div class="dialog-header"><h2 id="about-title">Replay Theater</h2><button class="icon-button" type="button" data-dismiss aria-label="Close"><span data-icon="x"></span></button></div>
  <p class="session-stats"><strong id="stat-edits">—</strong> edits · <strong id="stat-files">—</strong> files · <strong id="stat-added" class="added-text">—</strong> <strong id="stat-removed" class="removed-text">—</strong></p>
  <p id="source" class="muted"></p>
  <ul id="warnings"></ul>
  <dl class="shortcuts">
    <div><dt>Play / Pause</dt><dd><kbd>Space</kbd></dd></div>
    <div><dt>Previous / Next</dt><dd><kbd>←</kbd><kbd>→</kbd></dd></div>
    <div><dt>First / Last</dt><dd><kbd>Home</kbd><kbd>End</kbd></dd></div>
    <div><dt>Filter files</dt><dd><kbd>/</kbd></dd></div>
  </dl>
</dialog>
</body>
</html>
